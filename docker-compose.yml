# Local stack: the app plus Ollama for the local model and embeddings.
#   docker compose up -d && docker compose exec ollama ollama pull qwen2.5:7b && docker compose exec ollama ollama pull nomic-embed-text
services:
  app:
    build: .
    ports: ["127.0.0.1:8771:8770"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AR_ACCESS_TOKEN: ${AR_ACCESS_TOKEN:-}
    volumes:
      - ./data:/data:ro
      - app-logs:/srv/logs
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:0.12.6
    volumes: [ollama:/root/.ollama]
volumes:
  app-logs:
  ollama:
