[project]
name = "claimcheck-finetune"
version = "0.1.0"
description = "LoRA fine-tune of a small encoder that checks whether a claim is supported by a quote"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "scikit-learn>=1.5",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "pypdf>=4.0",
    "accelerate>=0.33",
]

[tool.uv]
package = false
